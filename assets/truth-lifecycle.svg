<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="620" viewBox="0 0 1600 620" role="img" aria-label="How evidence becomes a decision">
<defs>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#00130a" flood-opacity=".10"/></filter>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#22c55e"/><stop offset="1" stop-color="#35d6a0"/></linearGradient>
  <style>
    text{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#f3f8f5}
    .muted{fill:#9db0a5} .green{fill:#22c55e} .amber{fill:#f4b942} .blue{fill:#67b7f7} .red{fill:#fb7185}
    .label{font-size:14px;font-weight:700;letter-spacing:1.5px} .small{font-size:15px} .body{font-size:18px} .h3{font-size:21px;font-weight:700}.h2{font-size:30px;font-weight:750}.h1{font-size:46px;font-weight:780}
  </style>
</defs>
<rect width="100%" height="100%" fill="#07110d"/>

  <text x="72" y="72" class="label green">HOW IT WORKS</text><text x="72" y="124" class="h1">How evidence becomes a decision.</text><text x="72" y="158" class="body muted">The source remains visible even after the account becomes actionable.</text>
  <path d="M170 340H1430" stroke="#244032" stroke-width="6" stroke-linecap="round"/>
  <g><circle cx="92" cy="340" r="28" fill="#0d1b15" stroke="#244032" stroke-width="3"/><text x="92" y="346" text-anchor="middle" font-size="15" font-weight="800" fill="#f3f8f5">01</text><rect x="4" y="218" width="176" height="82" rx="16" fill="#0d1b15" stroke="#244032"/><text x="92" y="252" text-anchor="middle" class="h3">Evidence</text><text x="92" y="278" text-anchor="middle" class="small muted">Provider observation</text><text x="92" y="402" text-anchor="middle" class="small muted">What was seen</text></g><g><circle cx="306" cy="340" r="28" fill="#0d1b15" stroke="#244032" stroke-width="3"/><text x="306" y="346" text-anchor="middle" font-size="15" font-weight="800" fill="#f3f8f5">02</text><rect x="218" y="218" width="176" height="82" rx="16" fill="#0d1b15" stroke="#244032"/><text x="306" y="252" text-anchor="middle" class="h3">Identity</text><text x="306" y="278" text-anchor="middle" class="small muted">Subject binding</text><text x="306" y="402" text-anchor="middle" class="small muted">Who it belongs to</text></g><g><circle cx="520" cy="340" r="28" fill="#0d1b15" stroke="#244032" stroke-width="3"/><text x="520" y="346" text-anchor="middle" font-size="15" font-weight="800" fill="#f3f8f5">03</text><rect x="432" y="218" width="176" height="82" rx="16" fill="#0d1b15" stroke="#22c55e"/><text x="520" y="252" text-anchor="middle" class="h3">Truth</text><text x="520" y="278" text-anchor="middle" class="small muted">Reconciliation</text><text x="520" y="402" text-anchor="middle" class="small muted">What is current</text></g><g><circle cx="734" cy="340" r="28" fill="#0d1b15" stroke="#244032" stroke-width="3"/><text x="734" y="346" text-anchor="middle" font-size="15" font-weight="800" fill="#f3f8f5">04</text><rect x="646" y="218" width="176" height="82" rx="16" fill="#0d1b15" stroke="#244032"/><text x="734" y="252" text-anchor="middle" class="h3">Assessment</text><text x="734" y="278" text-anchor="middle" class="small muted">Versioned snapshot</text><text x="734" y="402" text-anchor="middle" class="small muted">What it means</text></g><g><circle cx="948" cy="340" r="28" fill="#0d1b15" stroke="#244032" stroke-width="3"/><text x="948" y="346" text-anchor="middle" font-size="15" font-weight="800" fill="#f3f8f5">05</text><rect x="860" y="218" width="176" height="82" rx="16" fill="#0d1b15" stroke="#244032"/><text x="948" y="252" text-anchor="middle" class="h3">Recommendation</text><text x="948" y="278" text-anchor="middle" class="small muted">Deterministic policy</text><text x="948" y="402" text-anchor="middle" class="small muted">What could happen</text></g><g><circle cx="1162" cy="340" r="28" fill="#0d1b15" stroke="#244032" stroke-width="3"/><text x="1162" y="346" text-anchor="middle" font-size="15" font-weight="800" fill="#f3f8f5">06</text><rect x="1074" y="218" width="176" height="82" rx="16" fill="#0d1b15" stroke="#22c55e"/><text x="1162" y="252" text-anchor="middle" class="h3">Decision</text><text x="1162" y="278" text-anchor="middle" class="small muted">Human response</text><text x="1162" y="402" text-anchor="middle" class="small muted">What was chosen</text></g><g><circle cx="1376" cy="340" r="28" fill="#22c55e" stroke="#22c55e" stroke-width="3"/><text x="1376" y="346" text-anchor="middle" font-size="15" font-weight="800" fill="#fff">07</text><rect x="1288" y="218" width="176" height="82" rx="16" fill="#0d1b15" stroke="#244032"/><text x="1376" y="252" text-anchor="middle" class="h3">Result</text><text x="1376" y="278" text-anchor="middle" class="small muted">Confirmed outcome</text><text x="1376" y="402" text-anchor="middle" class="small muted">What happened</text></g>
  <rect x="72" y="486" width="1456" height="72" rx="18" fill="#10231a" stroke="#244032"/><text x="104" y="530" class="body"><tspan font-weight="740" fill="#22c55e">Not the same thing:</tspan><tspan> observation ≠ truth · assessment ≠ recommendation · recommendation ≠ authorization · handoff ≠ confirmed result</tspan></text>
</svg>