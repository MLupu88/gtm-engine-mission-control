<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="720" viewBox="0 0 1600 720" role="img" aria-label="Campaign tracking and GA4 working together">
<defs>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#00130a" flood-opacity=".10"/></filter>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#22c55e"/><stop offset="1" stop-color="#35d6a0"/></linearGradient>
  <style>
    text{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#f3f8f5}
    .muted{fill:#9db0a5} .green{fill:#22c55e} .amber{fill:#f4b942} .blue{fill:#67b7f7} .red{fill:#fb7185}
    .label{font-size:14px;font-weight:700;letter-spacing:1.5px} .small{font-size:15px} .body{font-size:18px} .h3{font-size:21px;font-weight:700}.h2{font-size:30px;font-weight:750}.h1{font-size:46px;font-weight:780}
  </style>
</defs>
<rect width="100%" height="100%" fill="#07110d"/>

  <text x="72" y="73" class="label green">CAMPAIGN → ACCOUNT → OUTCOME</text><text x="72" y="126" font-size="41" font-weight="780">Traffic explains reach. Account evidence explains movement.</text>
  <rect x="72" y="170" width="1456" height="72" rx="18" fill="#0d1b15" stroke="#244032"/><circle cx="111" cy="206" r="14" fill="#22c55e"/><text x="140" y="201" class="h3">FY27 Service Automation</text><text x="140" y="225" class="small muted">LinkedIn · paid social · utm_campaign=service-automation-fy27</text><rect x="1278" y="191" width="208" height="30" rx="15" fill="#22c55e" opacity=".13" stroke="#22c55e"/><text x="1292" y="211" font-size="14" font-weight="650" fill="#22c55e">Campaign context retained</text>
  <rect x="72" y="274" width="424" height="344" rx="22" fill="#0d1b15" stroke="#244032"/>
  <text x="104" y="319" class="label blue">GA4 · AGGREGATE</text><text x="104" y="357" font-size="27" font-weight="750">What traffic did it drive?</text><text x="104" y="390" class="small muted">Anonymous and known visitors, measured together.</text>
  <text x="104" y="452" font-size="42" font-weight="780">1,842</text><text x="104" y="478" class="small muted">campaign sessions</text><text x="288" y="452" font-size="42" font-weight="780">1,306</text><text x="288" y="478" class="small muted">users</text>
  <g transform="translate(104 521)"><rect x="0" y="40" width="25" height="78" rx="5" fill="#67b7f7" opacity="0.42"/><rect x="41" y="74" width="25" height="44" rx="5" fill="#67b7f7" opacity="0.49"/><rect x="82" y="27" width="25" height="91" rx="5" fill="#67b7f7" opacity="0.56"/><rect x="123" y="60" width="25" height="58" rx="5" fill="#67b7f7" opacity="0.63"/><rect x="164" y="6" width="25" height="112" rx="5" fill="#67b7f7" opacity="0.7"/><rect x="205" y="46" width="25" height="72" rx="5" fill="#67b7f7" opacity="0.77"/><rect x="246" y="20" width="25" height="98" rx="5" fill="#67b7f7" opacity="0.8400000000000001"/></g>
  <rect x="526" y="274" width="548" height="344" rx="22" fill="#0d1b15" stroke="#244032"/>
  <text x="558" y="319" class="label green">ACCOUNT-LINKED EVIDENCE</text><text x="558" y="357" font-size="27" font-weight="750">Which accounts and leads moved?</text><text x="558" y="390" class="small muted">Only activity reliably linked to a known account.</text>
  <path d="M582 455H1014" stroke="#244032" stroke-width="4"/><circle cx="600" cy="455" r="13" fill="#22c55e"/><circle cx="730" cy="455" r="13" fill="#22c55e"/><circle cx="860" cy="455" r="13" fill="#22c55e"/><circle cx="996" cy="455" r="13" fill="#f4b942"/>
  <text x="576" y="500" class="small">Ad click</text><text x="683" y="500" class="small">Page visits</text><text x="816" y="500" class="small">Lead identified</text><text x="954" y="500" class="small">Decision</text>
  <rect x="558" y="535" width="484" height="54" rx="14" fill="#143824"/><text x="582" y="569" class="body" font-weight="720">Northstar Health · 3 active days · 1 lead</text>
  <rect x="1104" y="274" width="424" height="344" rx="22" fill="#0d1b15" stroke="#244032"/>
  <text x="1136" y="319" class="label amber">GTM ACTION WEB</text><text x="1136" y="357" font-size="27" font-weight="750">What should happen next?</text><text x="1136" y="390" class="small muted">Campaign context informs the decision;</text><text x="1136" y="412" class="small muted">it does not prove attribution by itself.</text>
  <text x="1136" y="448" class="label muted">ACCOUNT RESULT</text><text x="1136" y="484" class="body" font-weight="730">Pursue with context</text><text x="1136" y="516" class="small muted">Operator accepted · Email prepared</text><path d="M1136 543h360" stroke="#244032"/><text x="1136" y="578" class="small muted">Outcome awaiting confirmation</text>
  <text x="72" y="670" class="body muted">GA4 remains the source for aggregate traffic. Account activity stays separate until the person or company can be reliably identified.</text><text x="1324" y="704" class="small muted">Synthetic portfolio data</text>
</svg>