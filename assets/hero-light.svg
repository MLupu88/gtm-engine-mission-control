    .label{font-size:14px;font-weight:700;letter-spacing:1.5px} .small{font-size:15px} .body{font-size:18px} .h3{font-size:21px;font-weight:700}.h2{font-size:30px;font-weight:750}.h1{font-size:46px;font-weight:780}
  </style>
</defs>
<rect width="100%" height="100%" fill="#f4f7f5"/>

  <circle cx="1280" cy="104" r="330" fill="#08bd57" opacity=".05"/><circle cx="140" cy="720" r="260" fill="#287ac1" opacity=".05"/>
  <text x="72" y="88" class="label green">ACCOUNT-CENTRIC GTM OPERATING SYSTEM</text>
  <text x="72" y="164" font-size="56" font-weight="800">One account picture.</text><text x="72" y="228" font-size="56" font-weight="800">One defensible next move.</text>
  <text x="72" y="286" font-size="21" class="muted">Mission Control turns fragmented campaign, website, CRM and research</text><text x="72" y="318" font-size="21" class="muted">evidence into current account understanding—with a human at the boundary.</text>
  <g transform="translate(72 368)">
    <rect x="0" y="0" width="106" height="30" rx="15" fill="#287ac1" opacity=".13" stroke="#287ac1"/><text x="14" y="20" font-size="14" font-weight="650" fill="#287ac1">OBSERVE</text><rect x="122" y="0" width="132" height="30" rx="15" fill="#08bd57" opacity=".13" stroke="#08bd57"/><text x="136" y="20" font-size="14" font-weight="650" fill="#08bd57">UNDERSTAND</text><rect x="270" y="0" width="78" height="30" rx="15" fill="#b6780b" opacity=".13" stroke="#b6780b"/><text x="284" y="20" font-size="14" font-weight="650" fill="#b6780b">ACT</text><rect x="364" y="0" width="100" height="30" rx="15" fill="#dce5df" opacity=".55" stroke="#dce5df"/><text x="378" y="20" font-size="14" font-weight="650" fill="#17201b">RESULT</text>
  </g>
  <rect x="72" y="452" width="572" height="190" rx="24" fill="#ffffff" stroke="#dce5df" filter="url(#shadow)"/>
  <text x="104" y="496" class="label muted">THE OPERATING QUESTION</text><text x="104" y="542" class="h2">What changed at this account,</text><text x="104" y="579" class="h2">why now—and what should we do?</text>
  <path d="M104 608h508" stroke="#dce5df"/><text x="104" y="634" class="small muted">Evidence stays visible. Missing context stays missing. The decision stays human.</text>

  <path d="M894 183C1010 183 1018 264 1080 282M1430 183C1314 183 1306 264 1244 282M894 515C1010 515 1018 434 1080 416M1430 515C1314 515 1306 434 1244 416" fill="none" stroke="#dce5df" stroke-width="3" stroke-dasharray="8 10"/>
  <g><rect x="718" y="129" width="240" height="108" rx="18" fill="#ffffff" stroke="#287ac1"/><circle cx="750" cy="163" r="10" fill="#287ac1"/><text x="772" y="170" class="h3">Campaign</text><text x="750" y="203" class="small muted">LinkedIn · UTM context</text></g>
  <g><rect x="1366" y="129" width="166" height="108" rx="18" fill="#ffffff" stroke="#b6780b"/><circle cx="1398" cy="163" r="10" fill="#b6780b"/><text x="1420" y="170" class="h3">CRM</text><text x="1398" y="203" class="small muted">Owner · deal</text></g>
  <g><rect x="718" y="461" width="240" height="108" rx="18" fill="#ffffff" stroke="#08bd57"/><circle cx="750" cy="495" r="10" fill="#08bd57"/><text x="772" y="502" class="h3">Behavior</text><text x="750" y="535" class="small muted">Pricing · repeat visits</text></g>
  <g><rect x="1366" y="461" width="166" height="108" rx="18" fill="#ffffff" stroke="#287ac1"/><circle cx="1398" cy="495" r="10" fill="#287ac1"/><text x="1420" y="502" class="h3">Research</text><text x="1398" y="535" class="small muted">Useful context</text></g>

  <rect x="1008" y="240" width="360" height="258" rx="28" fill="#ffffff" stroke="#08bd57" stroke-width="2" filter="url(#shadow)"/>
  <text x="1044" y="284" class="label green">CANONICAL ACCOUNT</text><text x="1044" y="330" class="h2">Northstar Health</text><text x="1044" y="358" class="small muted">One current picture · evidence-backed</text>
  <rect x="1044" y="388" width="110" height="30" rx="15" fill="#08bd57" opacity=".13" stroke="#08bd57"/><text x="1058" y="408" font-size="14" font-weight="650" fill="#08bd57">Strong fit</text><rect x="1168" y="388" width="112" height="30" rx="15" fill="#08bd57" opacity=".13" stroke="#08bd57"/><text x="1182" y="408" font-size="14" font-weight="650" fill="#08bd57">High intent</text>
  <path d="M1044 438h288" stroke="#dce5df"/><text x="1044" y="468" class="small muted">NEXT MOVE</text><text x="1140" y="468" class="small" font-weight="750">Pursue with context</text>
  <circle cx="1307" cy="468" r="8" fill="#b6780b"/>
  <rect x="718" y="682" width="814" height="50" rx="16" fill="#fbfdfc" stroke="#dce5df"/><text x="1125" y="714" text-anchor="middle" class="body"><tspan font-weight="750" fill="#08bd57">Signals</tspan><tspan> → account truth → recommendation → </tspan><tspan font-weight="750">human decision</tspan><tspan> → result</tspan></text>
  <text x="72" y="744" class="small muted">Sanitized portfolio composition · synthetic companies and activity</text>
  
</svg>