<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="650" viewBox="0 0 1600 650" role="img" aria-label="A human operating journey through Mission Control">
<defs>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#00130a" flood-opacity=".10"/></filter>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#08bd57"/><stop offset="1" stop-color="#35d6a0"/></linearGradient>
  <style>
    text{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#17201b}
    .muted{fill:#6b7a71} .green{fill:#08bd57} .amber{fill:#b6780b} .blue{fill:#287ac1} .red{fill:#be445b}
    .label{font-size:14px;font-weight:700;letter-spacing:1.5px} .small{font-size:15px} .body{font-size:18px} .h3{font-size:21px;font-weight:700}.h2{font-size:30px;font-weight:750}.h1{font-size:46px;font-weight:780}
  </style>
</defs>
<rect width="100%" height="100%" fill="#f4f7f5"/>

  <text x="72" y="72" class="label green">A MORNING IN MISSION CONTROL</text><text x="72" y="124" class="h1">The work moves forward without losing the evidence.</text>
  <path d="M236 248H1364" stroke="#dce5df" stroke-width="5" stroke-linecap="round"/>
  <circle cx="236" cy="248" r="18" fill="#08bd57" stroke="#f4f7f5" stroke-width="6"/><text x="236" y="220" text-anchor="middle" class="label green">08:30</text><circle cx="612" cy="248" r="18" fill="#08bd57" stroke="#f4f7f5" stroke-width="6"/><text x="612" y="220" text-anchor="middle" class="label green">08:36</text><circle cx="988" cy="248" r="18" fill="#08bd57" stroke="#f4f7f5" stroke-width="6"/><text x="988" y="220" text-anchor="middle" class="label green">08:41</text><circle cx="1364" cy="248" r="18" fill="#b6780b" stroke="#f4f7f5" stroke-width="6"/><text x="1364" y="220" text-anchor="middle" class="label amber">LATER</text>
  <rect x="72" y="290" width="328" height="244" rx="22" fill="#ffffff" stroke="#08bd57" filter="url(#shadow)"/><text x="100" y="330" class="label" fill="#08bd57">01 · DAILY BRIEF</text><text x="100" y="374" font-size="25" font-weight="750">See what moved</text><path d="M100 402h272" stroke="#dce5df"/><text x="100" y="441" class="body" font-weight="720">12 accounts changed</text><text x="100" y="474" class="small muted">2 need attention</text><rect x="100" y="497" width="112" height="5" rx="3" fill="#08bd57"/><rect x="448" y="290" width="328" height="244" rx="22" fill="#ffffff" stroke="#287ac1" filter="url(#shadow)"/><text x="476" y="330" class="label" fill="#287ac1">02 · ACCOUNT STORY</text><text x="476" y="374" font-size="25" font-weight="750">Understand why now</text><path d="M476 402h272" stroke="#dce5df"/><text x="476" y="441" class="body" font-weight="720">Pricing + implementation</text><text x="476" y="474" class="small muted">3 active days · 1 person</text><rect x="476" y="497" width="112" height="5" rx="3" fill="#287ac1"/><rect x="824" y="290" width="328" height="244" rx="22" fill="#ffffff" stroke="#08bd57" filter="url(#shadow)"/><text x="852" y="330" class="label" fill="#08bd57">03 · HUMAN DECISION</text><text x="852" y="374" font-size="25" font-weight="750">Choose the next move</text><path d="M852 402h272" stroke="#dce5df"/><text x="852" y="441" class="body" font-weight="720">Pursue with context</text><text x="852" y="474" class="small muted">Accepted · reason recorded</text><rect x="852" y="497" width="112" height="5" rx="3" fill="#08bd57"/><rect x="1200" y="290" width="328" height="244" rx="22" fill="#ffffff" stroke="#b6780b" filter="url(#shadow)"/><text x="1228" y="330" class="label" fill="#b6780b">04 · RESULT</text><text x="1228" y="374" font-size="25" font-weight="750">Keep what happened</text><path d="M1228 402h272" stroke="#dce5df"/><text x="1228" y="441" class="body" font-weight="720">Email handoff confirmed</text><text x="1228" y="474" class="small muted">Outcome still pending</text><rect x="1228" y="497" width="112" height="5" rx="3" fill="#b6780b"/>
  <rect x="72" y="574" width="1456" height="42" rx="14" fill="#fbfdfc"/><text x="800" y="601" text-anchor="middle" class="body">The recommendation can change. The decision, handoff and result remain separate, inspectable states.</text>
  
</svg>