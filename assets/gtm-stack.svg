<rect width="100%" height="100%" fill="#07110d"/>

  <text x="72" y="72" class="label green">CONNECTED TO THE WORK, NOT JUST THE DATA</text><text x="72" y="124" class="h1">The GTM stack keeps its job. The account gains a memory.</text>
  <text x="72" y="158" class="body muted">Mission Control does not replace these systems. It carries defensible context between them.</text>
  <text x="72" y="218" class="label muted">EVIDENCE AND CONTEXT IN</text><text x="1180" y="218" class="label muted">HANDOFFS + REPORTING</text>
  <rect x="72" y="250" width="264" height="104" rx="18" fill="#0d1b15" stroke="#FF7A59"/><g transform="translate(98 276)" stroke="#FF7A59" stroke-width="5" stroke-linecap="round"><path d="M13 14l18 15M31 29l14-18M31 29v18"/><circle cx="10" cy="11" r="7" fill="#FF7A59" stroke="none"/><circle cx="48" cy="8" r="7" fill="#FF7A59" stroke="none"/><circle cx="31" cy="50" r="8" fill="#fff"/><circle cx="31" cy="50" r="5" fill="#FF7A59" stroke="none"/></g><text x="166" y="292" font-size="18" font-weight="750">HubSpot</text><text x="166" y="320" font-size="14" class="muted">CRM context</text><rect x="72" y="382" width="264" height="104" rx="18" fill="#0d1b15" stroke="#8B5CF6"/><rect x="98" y="407" width="52" height="52" rx="14" fill="#8B5CF6"/><text x="124" y="441" text-anchor="middle" font-size="24" font-weight="850" fill="#fff">R</text><text x="166" y="424" font-size="18" font-weight="750">RB2B</text><text x="166" y="452" font-size="14" class="muted">Identified visits</text><rect x="72" y="514" width="264" height="104" rx="18" fill="#0d1b15" stroke="#F9AB00"/><g transform="translate(98 535)"><rect x="0" y="24" width="16" height="28" rx="8" fill="#F9AB00"/><rect x="24" y="10" width="16" height="42" rx="8" fill="#E37400"/><circle cx="56" cy="44" r="8" fill="#F9AB00"/></g><text x="166" y="556" font-size="18" font-weight="750">Google Analytics</text><text x="166" y="584" font-size="14" class="muted">Aggregate traffic</text><rect x="360" y="250" width="264" height="104" rx="18" fill="#0d1b15" stroke="#67b7f7"/><circle cx="389" cy="303" r="25" fill="none" stroke="#67b7f7" stroke-width="5"/><path d="M407 321l19 19" stroke="#67b7f7" stroke-width="6" stroke-linecap="round"/><text x="454" y="292" font-size="18" font-weight="750">Client Radar</text><text x="454" y="320" font-size="14" class="muted">Company research</text><rect x="360" y="382" width="264" height="104" rx="18" fill="#0d1b15" stroke="#EA4B71"/><g transform="translate(386 401)" fill="none" stroke="#EA4B71" stroke-width="4"><path d="M8 40l16-20 16 23 14-28"/><circle cx="8" cy="40" r="7" fill="#fff"/><circle cx="24" cy="20" r="7" fill="#fff"/><circle cx="40" cy="43" r="7" fill="#fff"/><circle cx="54" cy="15" r="7" fill="#fff"/></g><text x="454" y="424" font-size="18" font-weight="750">n8n</text><text x="454" y="452" font-size="14" class="muted">Ingestion + orchestration</text><rect x="360" y="514" width="264" height="104" rx="18" fill="#0d1b15" stroke="#0A66C2"/><g transform="translate(386 537)"><rect width="58" height="58" rx="10" fill="#0A66C2"/><circle cx="15" cy="17" r="4" fill="#fff"/><rect x="11" y="25" width="8" height="22" rx="2" fill="#fff"/><path d="M26 25h8v4c3-4 7-5 11-5 9 0 11 6 11 15v8h-8v-8c0-6-1-8-5-8-5 0-8 3-8 10v6h-9z" fill="#fff"/></g><text x="454" y="556" font-size="18" font-weight="750">LinkedIn Ads</text><text x="454" y="584" font-size="14" class="muted">Campaign + UTM context</text>
  <path d="M624 302H724M624 434H724M624 566H724" stroke="#244032" stroke-width="3" stroke-dasharray="7 9"/>
  <rect x="724" y="276" width="388" height="316" rx="30" fill="#0d1b15" stroke="#22c55e" stroke-width="2" filter="url(#shadow)"/><rect x="756" y="309" width="42" height="42" rx="12" fill="url(#accent)"/><path d="M768 330h18M777 321v18" stroke="#fff" stroke-width="4" stroke-linecap="round"/><text x="816" y="337" class="h2">Mission Control</text><text x="756" y="386" class="label green">ONE CANONICAL ACCOUNT</text><text x="756" y="430" class="h2">Northstar Health</text><text x="756" y="462" class="small muted">Current truth · evidence · decision history</text><path d="M756 492h324" stroke="#244032"/><text x="756" y="528" class="small">Recommendation</text><text x="904" y="528" class="small" font-weight="750">Pursue with context</text><text x="756" y="560" class="small muted">Human approval required before handoff</text>
  <path d="M1112 434h68" stroke="#244032" stroke-width="3" stroke-dasharray="7 9"/>
  <rect x="1180" y="250" width="348" height="148" rx="20" fill="#0d1b15" stroke="#22c55e"/><circle cx="1241" cy="323" r="29" fill="#143824"/><path d="M1227 323l10 10 20-23" fill="none" stroke="#22c55e" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><text x="1290" y="309" class="h3">Approved handoff</text><text x="1290" y="338" class="small muted">Immutable provenance</text><text x="1212" y="372" font-size="14">Execution stays separate from the recommendation.</text>
  <rect x="1180" y="422" width="166" height="170" rx="20" fill="#0d1b15" stroke="#f4b942"/><text x="1212" y="454" font-size="11" font-weight="750" letter-spacing="1" fill="#f4b942">LEGACY REPORT</text><text x="1212" y="488" font-size="26" font-weight="850" fill="#f4b942">PDF</text><text x="1212" y="524" class="h3">Leadership</text><text x="1212" y="552" class="small muted">Campaign report</text><text x="1212" y="578" class="small muted">with limitations</text>
  <rect x="1362" y="422" width="166" height="170" rx="20" fill="#0d1b15" stroke="#67b7f7"/><text x="1394" y="454" font-size="11" font-weight="750" letter-spacing="1" fill="#67b7f7">LEGACY REPORT</text><text x="1394" y="488" font-size="26" font-weight="850" fill="#67b7f7">CSV</text><text x="1394" y="524" class="h3">Operations</text><text x="1394" y="552" class="small muted">Execution and</text><text x="1394" y="578" class="small muted">analysis rows</text>
  <text x="72" y="650" class="small muted">LinkedIn Ads = captured campaign / UTM context, not a direct Ads API. PDF / CSV = current legacy-report exports.</text><text x="72" y="676" class="small muted">Canonical campaign reporting is the frontier. Logos and marks belong to their respective owners.</text>
  
