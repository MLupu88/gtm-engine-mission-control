  <rect x="594" y="226" width="360" height="282" rx="28" fill="#ffffff" stroke="#08bd57" stroke-width="2" filter="url(#shadow)"/><circle cx="774" cy="289" r="44" fill="#e8f9ef"/><path d="M757 289h34M774 272v34" stroke="#08bd57" stroke-width="6" stroke-linecap="round"/><text x="774" y="362" text-anchor="middle" class="h2">AI interpretation</text><text x="774" y="396" text-anchor="middle" class="small muted">DeepSeek reads account evidence</text><path d="M646 426h256" stroke="#dce5df"/><text x="774" y="461" text-anchor="middle" class="small">Cannot change account facts</text>
