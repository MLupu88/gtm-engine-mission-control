  <circle cx="114" cy="269" r="7" fill="#287ac1"/><text x="134" y="274" class="small" font-weight="750">09:14</text><text x="200" y="274" class="small muted">LinkedIn campaign touch</text><circle cx="114" cy="329" r="7" fill="#08bd57"/><text x="134" y="334" class="small" font-weight="750">10:02</text><text x="200" y="334" class="small muted">Pricing page · 4m 21s</text><circle cx="114" cy="389" r="7" fill="#08bd57"/><text x="134" y="394" class="small" font-weight="750">TUE</text><text x="200" y="394" class="small muted">Returned to implementation</text><circle cx="114" cy="449" r="7" fill="#b6780b"/><text x="134" y="454" class="small" font-weight="750">CRM</text><text x="200" y="454" class="small muted">Owner and open deal</text>
