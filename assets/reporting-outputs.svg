<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="760" viewBox="0 0 1600 760" role="img" aria-label="Campaign reporting and operational outputs">
<defs>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#00130a" flood-opacity=".10"/></filter>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#08bd57"/><stop offset="1" stop-color="#35d6a0"/></linearGradient>
  <style>
    text{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#17201b}
    .muted{fill:#6b7a71} .green{fill:#08bd57} .amber{fill:#b6780b} .blue{fill:#287ac1} .red{fill:#be445b}
    .label{font-size:14px;font-weight:700;letter-spacing:1.5px} .small{font-size:15px} .body{font-size:18px} .h3{font-size:21px;font-weight:700}.h2{font-size:30px;font-weight:750}.h1{font-size:46px;font-weight:780}
  </style>
</defs>
<rect width="100%" height="100%" fill="#f4f7f5"/>

  <text x="72" y="72" class="label green">THE LOOP DOES NOT END AT OUTREACH</text><text x="72" y="124" class="h1">Decisions become operating history—and useful reporting.</text>
  <rect x="72" y="176" width="940" height="508" rx="24" fill="#ffffff" stroke="#dce5df" filter="url(#shadow)"/>
  <text x="108" y="220" class="label muted">LEGACY OUTBOUND REPORT · CURRENT EXPORT SURFACE</text><text x="108" y="265" class="h2">FY27 Service Automation</text><text x="108" y="295" class="small muted">Aug 1 – Aug 31 · Export source and limitations retained</text>
  <rect x="108" y="332" width="178" height="108" rx="16" fill="#fbfdfc" stroke="#dce5df"/><text x="128" y="376" font-size="34" font-weight="780">18</text><text x="128" y="410" class="small muted">Accounts</text><rect x="310" y="332" width="178" height="108" rx="16" fill="#fbfdfc" stroke="#dce5df"/><text x="330" y="376" font-size="34" font-weight="780">7</text><text x="330" y="410" class="small muted">Human decisions</text><rect x="538" y="332" width="178" height="108" rx="16" fill="#fbfdfc" stroke="#dce5df"/><text x="558" y="376" font-size="34" font-weight="780">5</text><text x="558" y="410" class="small muted">Actions logged</text><rect x="766" y="332" width="178" height="108" rx="16" fill="#fbfdfc" stroke="#dce5df"/><text x="786" y="376" font-size="34" font-weight="780">2</text><text x="786" y="410" class="small muted">Outcomes</text>
  <text x="108" y="492" class="h3">Account decisions and outcomes</text>
  <g transform="translate(108 525)"><text class="label muted">ACCOUNT</text><text x="270" class="label muted">DECISION</text><text x="500" class="label muted">ACTION</text><text x="735" class="label muted">OUTCOME</text><path d="M0 18h808" stroke="#dce5df"/>
  <text y="58" class="small" font-weight="680">Northstar Health</text><text x="270" y="58" class="small">Pursue</text><text x="500" y="58" class="small">Email prepared</text><text x="735" y="58" class="small green">Meeting booked</text><text y="110" class="small" font-weight="680">Atlas Financial</text><text x="270" y="110" class="small">Research first</text><text x="500" y="110" class="small">Research started</text><text x="735" y="110" class="small muted">Pending</text><text y="162" class="small" font-weight="680">Cedar Retail</text><text x="270" y="162" class="small">Watch</text><text x="500" y="162" class="small">No action</text><text x="735" y="162" class="small muted">No outcome yet</text></g>
  <rect x="1044" y="176" width="484" height="236" rx="24" fill="#ffffff" stroke="#dce5df" filter="url(#shadow)"/>
  <text x="1076" y="220" class="label blue">LEADERSHIP OUTPUT</text><text x="1076" y="262" class="h2">Campaign report · PDF</text><text x="1076" y="302" class="body">Readable summary of movement, decisions,</text><text x="1076" y="330" class="body">actions, outcomes, costs and limitations.</text><rect x="1076" y="356" width="174" height="34" rx="10" fill="#e8f9ef"/><text x="1094" y="379" class="small green" font-weight="720">Export report</text>
  <rect x="1044" y="448" width="484" height="236" rx="24" fill="#ffffff" stroke="#dce5df" filter="url(#shadow)"/>
  <text x="1076" y="492" class="label amber">OPERATIONAL OUTPUT</text><text x="1076" y="534" class="h2">CSV · execution-ready</text><text x="1076" y="574" class="body">Account, recommendation, decision, action</text><text x="1076" y="602" class="body">and outcome rows with their reporting period.</text><rect x="1076" y="628" width="218" height="34" rx="10" fill="#fbfdfc" stroke="#dce5df"/><text x="1094" y="651" class="small" font-weight="720">Download operational CSV</text>
  <text x="72" y="724" class="small muted">Kept separate from GA4 and canonical identified-touch history.</text><text x="1328" y="724" class="small muted">Synthetic portfolio data</text>
